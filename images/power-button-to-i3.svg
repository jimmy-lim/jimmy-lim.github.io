<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'SFMono-Regular','Consolas','Liberation Mono',Menlo,monospace">
  <!-- desktop -->
  <rect width="1200" height="630" fill="#12131c"/>

  <!-- left window (focused): dmesg -->
  <rect x="0" y="0" width="600" height="604" fill="#1a1b26"/>
  <rect x="0" y="0" width="600" height="24" fill="#285577" stroke="#4c7899" stroke-width="1"/>
  <text x="8" y="17" font-size="13" fill="#ffffff">jimmy@laptop: ~ (dmesg)</text>
  <rect x="1" y="24" width="598" height="579" fill="none" stroke="#4c7899" stroke-width="2"/>

  <text x="16" y="56" font-size="15" fill="#7aa2f7">$</text>
  <text x="32" y="56" font-size="15" fill="#c0caf5">dmesg | less</text>
  <g font-size="14" xml:space="preserve">
    <text x="16" y="88"><tspan fill="#565872">[    0.000000]</tspan><tspan fill="#c0caf5"> Linux version 6.12.107+deb13-amd64</tspan></text>
    <text x="16" y="114"><tspan fill="#565872">[    0.024716]</tspan><tspan fill="#c0caf5"> Kernel command line: … ro quiet</tspan></text>
    <text x="16" y="140"><tspan fill="#565872">[    0.069087]</tspan><tspan fill="#c0caf5"> smp: Bringing up secondary CPUs ...</tspan></text>
    <text x="16" y="166"><tspan fill="#565872">[    0.084657]</tspan><tspan fill="#c0caf5"> Memory: 7874272K/8253572K available</tspan></text>
    <text x="16" y="192"><tspan fill="#565872">[    0.238646]</tspan><tspan fill="#c0caf5"> Trying to unpack rootfs image as initramfs</tspan></text>
    <rect x="8" y="203" width="584" height="24" rx="4" fill="#e0af6822"/>
    <text x="16" y="220"><tspan fill="#565872">[    0.559019]</tspan><tspan fill="#e0af68" font-weight="bold"> Run /init as init process</tspan><tspan fill="#e0af68">  ★</tspan></text>
    <text x="16" y="248"><tspan fill="#565872">[    0.915251]</tspan><tspan fill="#c0caf5">  nvme0n1: p1 p2 p3</tspan></text>
    <text x="16" y="274"><tspan fill="#565872">[    1.596927]</tspan><tspan fill="#c0caf5"> EXT4-fs (nvme0n1p2): mounted filesystem … ro</tspan></text>
    <text x="16" y="300"><tspan fill="#565872">[    1.811203]</tspan><tspan fill="#9ece6a"> systemd[1]: systemd 257.13 running</tspan></text>
    <text x="16" y="326"><tspan fill="#565872">[    2.228524]</tspan><tspan fill="#9ece6a"> systemd[1]: … graphical.target</tspan></text>
    <text x="16" y="352"><tspan fill="#565872">[    2.375423]</tspan><tspan fill="#c0caf5"> EXT4-fs (nvme0n1p2): re-mounted r/w</tspan></text>
    <text x="16" y="378"><tspan fill="#565872">[    5.442677]</tspan><tspan fill="#c0caf5"> [drm] Initialized i915 1.6.0</tspan></text>
    <text x="16" y="404"><tspan fill="#565872">[    9.655984]</tspan><tspan fill="#c0caf5"> wlp2s0: associated</tspan></text>
  </g>
  <text x="16" y="440" font-size="14" fill="#565872">:</text>
  <rect x="28" y="429" width="9" height="15" fill="#c0caf5"/>

  <!-- right-top window: systemd-analyze -->
  <rect x="602" y="0" width="598" height="300" fill="#1a1b26"/>
  <rect x="602" y="0" width="598" height="24" fill="#222222" stroke="#333333" stroke-width="1"/>
  <text x="610" y="17" font-size="13" fill="#888888">jimmy@laptop: ~ (systemd-analyze)</text>
  <text x="618" y="56" font-size="15" fill="#7aa2f7">$</text>
  <text x="634" y="56" font-size="15" fill="#c0caf5">systemd-analyze</text>
  <g font-size="14" fill="#c0caf5">
    <text x="618" y="88">Startup finished in</text>
    <text x="634" y="114"><tspan fill="#bb9af7">4.378s</tspan> (firmware)</text>
    <text x="634" y="140">+ <tspan fill="#bb9af7">4.309s</tspan> (loader)</text>
    <text x="634" y="166">+ <tspan fill="#bb9af7">1.681s</tspan> (kernel)</text>
    <text x="634" y="192">+ <tspan fill="#bb9af7">3.235s</tspan> (userspace)</text>
    <text x="634" y="218">= <tspan fill="#9ece6a" font-weight="bold">13.604s</tspan></text>
    <text x="618" y="250">graphical.target reached after 3.234s</text>
    <text x="618" y="274">in userspace.</text>
  </g>

  <!-- right-bottom window: how X and i3 start -->
  <rect x="602" y="302" width="598" height="302" fill="#1a1b26"/>
  <rect x="602" y="302" width="598" height="24" fill="#222222" stroke="#333333" stroke-width="1"/>
  <text x="610" y="319" font-size="13" fill="#888888">jimmy@laptop: ~ (i3 config)</text>
  <text x="618" y="358" font-size="15" fill="#7aa2f7">$</text>
  <text x="634" y="358" font-size="15" fill="#c0caf5">cat ~/.xinitrc</text>
  <text x="618" y="386" font-size="14" fill="#e0af68">exec i3</text>
  <text x="618" y="424" font-size="15" fill="#7aa2f7">$</text>
  <text x="634" y="424" font-size="15" fill="#c0caf5">grep ^exec ~/.config/i3/config</text>
  <g font-size="14" fill="#c0caf5">
    <text x="618" y="456"><tspan fill="#7dcfff">exec</tspan> --no-startup-id dex --autostart …</text>
    <text x="618" y="482"><tspan fill="#7dcfff">exec</tspan> --no-startup-id xss-lock … i3lock</text>
    <text x="618" y="508"><tspan fill="#7dcfff">exec</tspan> --no-startup-id nm-applet</text>
    <text x="618" y="534"><tspan fill="#7dcfff">exec</tspan> --no-startup-id nitrogen --restore</text>
  </g>
  <text x="618" y="570" font-size="15" fill="#7aa2f7">$</text>
  <rect x="634" y="558" width="9" height="16" fill="#c0caf5"/>

  <!-- split line between columns -->
  <rect x="600" y="0" width="2" height="604" fill="#12131c"/>
  <rect x="602" y="300" width="598" height="2" fill="#12131c"/>

  <!-- i3bar -->
  <rect x="0" y="604" width="1200" height="26" fill="#000000"/>
  <g font-size="13">
    <rect x="2" y="606" width="24" height="22" fill="#285577" stroke="#4c7899"/>
    <text x="14" y="621" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="28" y="606" width="24" height="22" fill="#222222" stroke="#333333"/>
    <text x="40" y="621" fill="#888888" text-anchor="middle">2</text>
    <rect x="54" y="606" width="24" height="22" fill="#222222" stroke="#333333"/>
    <text x="66" y="621" fill="#888888" text-anchor="middle">3</text>

    <text x="1160" y="621" fill="#ffffff" text-anchor="end" xml:space="preserve"><tspan fill="#ff5555">no IPv6</tspan> | <tspan fill="#55ff55">W: ( 72% at home ) 192.168.1.20</tspan> | <tspan fill="#ff5555">E: down</tspan> | BAT 87.00% 3:12 | 41.2 GiB | 0.48 | 2.1 GiB | 2026-10-03 10:30:00</text>
    <!-- nm-applet tray icon -->
    <g transform="translate(1180,617)" fill="none" stroke="#c0caf5" stroke-width="1.6" stroke-linecap="round">
      <path d="M-7,-3 a10,10 0 0 1 14,0"/>
      <path d="M-4.5,0 a6,6 0 0 1 9,0"/>
      <circle cx="0" cy="3" r="1.2" fill="#c0caf5" stroke="none"/>
    </g>
  </g>
</svg>
